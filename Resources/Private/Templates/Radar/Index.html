{namespace core=TYPO3\CMS\Core\ViewHelpers}
<link rel="stylesheet" href="{f:uri.resource(path: 'Css/backend.css', extensionName: 'ContentRadar')}"/>

<div class="content-radar">
    <h1><f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:module.title" /></h1>

    <div class="content-radar__actions">
        <f:link.action action="index">
            <f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:actions.all" />
        </f:link.action>

        <f:link.action action="index" arguments="{filter: 'leaf'}">
            <f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:actions.leaf" />
        </f:link.action>
    </div>

    <table>
        <thead>
            <tr>
                <th>
                    <f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:label.page" />
                </th>
                <th class="{f:if(condition: sort == 'age_desc', then: 'is-active')}">
                    <f:link.action action="index" arguments="{sort: 'age_desc', filter: filter}">
                        <f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:label.age" />
                    </f:link.action>
                    <f:if condition="{sort} == 'age_desc'">
                        ↓
                    </f:if>
                </th>
                <th>
                    <f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:label.incoming" />
                </th>
                <th>
                    <f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:label.leaf" />
                </th>
                <th class="{f:if(condition: sort == 'score_desc' || sort == 'score_asc', then: 'is-active')}">
                    <f:link.action action="index" arguments="{sort: 'score_desc', filter: filter}">
                        <f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:label.score" />
                    </f:link.action>
                    <f:if condition="{sort} == 'score_desc'">
                        ↓
                    </f:if>
                    <f:if condition="{sort} == 'score_asc'">
                        ↑
                    </f:if>
                </th>
                <th>
                    <f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:label.status" />
                </th>
            </tr>
        </thead>

        <tbody>
            <f:for each="{pageGroups}" as="group">
                <tr class="default-row row-status-{group.defaultPage.status}">
                    <td>
                        <core:icon identifier="{group.defaultPage.language_flag}" size="small" alternativeMarkupIdentifier="inline" title="{group.defaultPage.language}" />
                        {group.defaultPage.title}
                    </td>
                    <td>{group.defaultPage.age}</td>
                    <td>{group.defaultPage.incoming}</td>
                    <td>
                        <f:if condition="{group.defaultPage.is_leaf}">⚠️</f:if>
                    </td>
                    <td>
                        <span class="score score-{f:if(condition: group.defaultPage.score < 40, then: 'low',
                            else: f:if(condition: group.defaultPage.score < 70, then: 'medium', else: 'high')
                        )}">
                            {group.defaultPage.score}
                        </span>
                    </td>
                    <td>
                        <span class="content-radar__status status-{group.defaultPage.status}">
                            {group.defaultPage.status}
                        </span>
                    </td>
                </tr>

                <f:for each="{group.translations}" as="page">
                    <tr class="translation-row row-status-{page.status}">
                        <td class="translation-title">
                            <core:icon identifier="{page.language_flag}" size="small" alternativeMarkupIdentifier="inline" title="{page.language}" />
                            {page.title}
                        </td>
                        <td>{page.age}</td>
                        <td>{page.incoming}</td>
                        <td>
                            <f:if condition="{page.is_leaf}">⚠️</f:if>
                        </td>
                        <td>
                            <span class="score score-{f:if(condition: page.score < 40, then: 'low',
                                else: f:if(condition: page.score < 70, then: 'medium', else: 'high')
                            )}">
                                {page.score}
                            </span>
                        </td>
                        <td>
                            <span class="content-radar__status status-{page.status}">
                                {page.status}
                            </span>
                        </td>
                    </tr>
                </f:for>
            </f:for>
        </tbody>
    </table>
</div>
