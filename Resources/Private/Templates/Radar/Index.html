<link rel="stylesheet" href="{f:uri.resource(path: 'Css/backend.css', extensionName: 'ContentRadar')}" />

<div class="content-radar">
    <h1><f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:module.title" /></h1>

    <div class="content-radar__actions">
        <f:link.action action="index"><f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:actions.all" /></f:link.action>
        <f:link.action action="index" arguments="{filter: 'critical'}"><f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:actions.critical" /></f:link.action>
        <f:link.action action="index" arguments="{filter: 'leaf'}"><f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:actions.leaf" /></f:link.action>
        <f:link.action action="index" arguments="{sort: 'age_desc'}"><f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:actions.ageDesc" /></f:link.action>
    </div>

    <table>
        <tr>
            <th><f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:table.page" /></th>
            <th><f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:table.age" /></th>
            <th><f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:table.links" /></th>
            <th><f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:table.orphan" /></th>
            <th><f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:table.score" /></th>
            <th><f:translate key="LLL:EXT:content_radar/Resources/Private/Language/locallang_mod.xlf:table.status" /></th>
        </tr>

        <f:for each="{pages}" as="page">
            <tr>
                <td>{page.title}</td>
                <td>{page.age}</td>
                <td>{page.incoming}</td>
                <td>
                    <f:if condition="{page.is_orphan}">
                        ⚠️
                    </f:if>
                </td>
                <td>
                    <span class="score score-{f:if(condition: page.score < 40, then: 'low',
                        else: f:if(condition: page.score < 70, then: 'medium', else: 'high')
                    )}">
                        {page.score}
                    </span>
                </td>
                <td>
                    <span class="status status-{page.status}">
                        {page.status}
                    </span>
                </td>
            </tr>
        </f:for>
    </table>
</div>
